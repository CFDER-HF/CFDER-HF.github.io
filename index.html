<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Courses</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: 0 auto; color: #2c3e50; }
    a { color: #2980b9; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .courses { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 20px; margin-top: 30px; }
    .course { display: block; padding: 28px; border: 2px solid #ecf0f1; border-radius: 12px; font-size: 28px; font-weight: bold; text-align: center; }
    .course:hover, .course:focus-visible { background: #f4f6f8; border-color: #2980b9; }
  </style>
</head>
<body>
  <main>
    <h1>Math Courses</h1>
    <p>Select a course to view its materials.</p>
    <nav class="courses" aria-label="Courses">
      <a class="course" href="MATH2111/">MATH2111</a>
      <a class="course" href="MATH1014/">MATH1014</a>
    </nav>
  </main>
</body>
</html>
